name: Create FoundryVTT Module Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version for label (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
  
      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Version must be in format v1.0.0 or v1.0.0-beta"
            exit 1
          fi

      # update version and download link in module.json
      - name: Read version from package.json
        id: read_version_from_package
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_ENV
          echo "$GITHUB_ENV"

      - name: Update module.json version and download link
        id: update_module_version
        uses: cschleiden/replace-tokens@v1
        with:
          files: './module.json'
        env:
          DOWNLOAD: https://github.com/${{github.repository}}/releases/download/${{github.event.inputs.version}}/mallindor-rest-${{github.event.inputs.version}}.zip
          VERSION: ${{ env.pkg_version }}
  
      - name: Install dependencies
        run: npm ci
      
      - name: Build module
        run: npm run build

      # save the output folder for release job
      - name: Archive dist folder
        uses: actions/upload-artifact@v4
        with:
          name: module-download
          path: dist/
      
      - name: Archive module json
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: ./module.json 

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download module download file
        uses: actions/download-artifact@v4
        with:
          name: module-download
          path: module-download
      
      - name: Download module.json
        uses: actions/download-artifact@v4
        with:
          name: module
      
      # Create a zip file with all files required by the module to add to the release
      - run: (cd module-download; zip -r ../module.zip .)

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.inputs.version }}
          body: |
            ## Installation
          
            Copy the link to module.json below and paste into Foundry module installer.
          draft: false
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          artifacts: "./module.zip,./module.json"
